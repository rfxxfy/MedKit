services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: medkit
      POSTGRES_USER: medkit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medkit -d medkit"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  app:
    image: medkit:${IMAGE_TAG:-local}
    build:
      context: .
      args:
        VCS_REF: ${IMAGE_TAG:-development}
    environment:
      DATABASE_URL: postgresql+psycopg://medkit:${POSTGRES_PASSWORD}@db:5432/medkit
      BASE_URL: ${BASE_URL:-http://localhost:8010}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8010,http://127.0.0.1:8010}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${APP_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    profiles: [https]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]
    restart: unless-stopped
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
