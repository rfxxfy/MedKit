name: MedKit checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr fonts-dejavu-core
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: mypy backend/app
      - run: pytest --junitxml=artifacts/pytest.xml
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: docker build --build-arg VCS_REF=${{ github.sha }} -t medkit:${{ github.sha }} .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/
